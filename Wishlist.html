<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet"/>
  <title>Wishlist</title>
  

  <style>
    *
    {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root
    {
        --cream: #FADADD;
        --butter: #FDEEA4;
        --rose: #E8B4B8;
        --charcoal: #3A3A3A;
        --sage: #DCE5D8;
    }
    html,
    body
    {
        background-color: var(--cream);
    }
    .navbar
    {
        width: 100%;
        height: 80px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
    }
    .icon-row
    {
        display: flex;
        flex-direction: row;
        gap: 10px;
    }
    .card-box
    {
        height: 340px;
        width: 300px;
    }
    .card-box img
    {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 15px;
    }
    .wish-items
    {
        display: flex;
        flex-direction: row;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
    }
    .btn
    {
        width: 80px;
        height: 40px;
        background-color: var(--butter);
        border: none;
        color: var(--charcoal);
    }
    .card
    {
        width: 300px;
        height: 460px;
        background-color: var(--rose);
        border-radius: 15px;
    }
    .product-description
    {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px 10px;
    }
    .prdct-name
    {
        font-size: 19px;
    }
    .product-price
    {
        font-size: 17px;
    }
    .logo
    {
        font-size: 2.5rem;
        font-weight: bold;
        color: var(--charcoal);
    }
    .nav-rgt
    {
        display: flex;
        flex-direction: row;
        gap: 10px;
    }
    .nav-rgt i
    {
        font-size: 25px;
        color: var(--charcoal);
    }
    .nav-rgt a
    {
        text-decoration: none;
    }
    .nav-cntr
    {
        display: flex;
        flex-direction: row;
        gap: 20px;
    }
    .nav-cntr a
    {
        text-decoration: none;
        color: var(--charcoal);
    }
    #trash-icon
    {
        
        font-size: 20px;
    }
    @media(max-width:480px)
    {
        .navbar
        {
            padding: 0 10px;
        }
        .logo
        {
            font-size: 1.5rem;
        }
        .nav-cntr
        {
            gap: 10px;
        }
        .nav-rgt i
        {
            font-size: 20px;
        }
    }
  </style>
</head>
<body>
  <header>
    <div class="navbar">
      <div class="nav-lft">
        <div class="logo">Rosalyn</div>
      </div>
      <div class="nav-cntr">
        <a href="index.html">Home</a>
        <a href="index.html#container-four">About</a>
        <a href="ProductSectionOne.html">Collections</a>
      </div>
      <div class="nav-rgt">
        <a href="cart.html">
        <i class="ri-shopping-bag-3-line"></i>
        <span id="cart-count">0</span>
        </a>
      </div>
    </div>
  </header>

  <div class="wish-main">
    <div class="wish-items" id="wish-container"></div>
  </div>

  <script>
    let wishlist = JSON.parse(localStorage.getItem('Rosalyn_wishlist')) || [];
    let cart = JSON.parse(localStorage.getItem('Rosalyn_cart')) || [];
    const container = document.getElementById('wish-container');

    function saveToStorage()
    {
      localStorage.setItem('Rosalyn_wishlist', JSON.stringify(wishlist));
      localStorage.setItem('Rosalyn_cart', JSON.stringify(cart));
    }

    function updateCounts()
    {
      const cartCountEl = document.getElementById('cart-count');
      if(cartCountEl) cartCountEl.innerText = cart.reduce((total, item) => total + item.qty, 0);
    }

    function renderWishlist()
    {
      container.innerHTML = '';
      if (wishlist.length === 0)
      {
        container.innerHTML = '<div class="empty-txt">Your wishlist is empty</div>';
        updateCounts();
        return;
      }

      wishlist.forEach((item) =>
      {
        container.innerHTML += `
          <div class="card">
            <div class="card-box"><img src="${item.img}"></div>
            <div class="product-description">
              <div class="prdct-name">${item.name}</div>
              <div class="product-price">Rs.${item.price.toLocaleString('en-IN')}</div>
              <div class="icon-row">
                <button class="btn" onclick="moveToCart('${item.id}')">Add to Cart</button>
                <button class="btn btn-red" onclick="removeItem('${item.id}')">
                  <i class="ri-delete-bin-line" id="trash-icon"></i>
                </button>
              </div>
            </div>
          </div>
        `;
      });
      updateCounts();
    }

    function removeItem(id)
    {
      wishlist = wishlist.filter(p => p.id !== id);
      saveToStorage();
      renderWishlist();
    }

    function moveToCart(id)
    {
      const item = wishlist.find(p => p.id === id);
      const existing = cart.find(p => p.id === id);
      if (existing) existing.qty++;
      else cart.push({...item, qty: 1});
      removeItem(id);
      alert(item.name + ' moved to Cart!');
    }

    renderWishlist();
  </script>
</body>
</html>

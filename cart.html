<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart</title>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet"/>
  <style>
    *
    {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root
    {
        --cream: #FADADD;
        --butter: #FDEEA4;
        --rose: #E8B4B8;
        --charcoal: #3A3A3A;
        --sage: #DCE5D8;
    }
    html,
    body
    {
        background-color: var(--sage);
    }
   .navbar
    {
        width: 100%;
        height: 80px;
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        padding: 0 30px;
        background-color: var(--sage);
    }
   .logo
    {
        font-size: 2.5rem;
        font-weight: bold;
        color: var(--charcoal);
    }
   .nav-rgt
    {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
    }
   .nav-rgt i
    {
        font-size: 25px;
        color: var(--charcoal);
    }
   .nav-rgt a
    {
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
    }
   .nav-cntr
    {
        display: flex;
        flex-direction: row;
        gap: 20px;
    }
   .nav-cntr a
    {
        text-decoration: none;
        color: var(--charcoal);
        font-weight: 500;
    }
   .card-box
    {
        height: 150px;
        width: 130px;
        flex-shrink: 0;
    }
   .card-box img
    {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 15px;
    }
   .product-description
    {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1;
    }
   .cart-nm
    {
        font-size: 19px;
        color: var(--charcoal);
        font-weight: 600;
    }
   .cart-prc
    {
        font-size: 18px;
        color: var(--charcoal);
    }
   .qty-rw
    {
        display: flex;
        flex-direction: row;
        gap: 10px;
        align-items: center;
    }
   .qty-btn
    {
        width: 35px;
        height: 35px;
        background-color: var(--sage);
        border: none;
        border-radius: 8px;
        font-size: 16px;
        color: var(--charcoal);
        cursor: pointer;
    }
   .cart-total
    {
        font-size: 1.7rem;
        font-weight: bold;
        color: var(--charcoal);
        text-align: center;
        margin-top: 30px;
    }
   .remove-btn
    {
        color: var(--charcoal);
        font-size: 20px;
        background-color: var(--sage);
        border: none;
        width: 40px;
        height: 40px;
        cursor: pointer;
    }
    #wishlist-count
    {
        color: var(--charcoal);
        font-weight: 600;
    }
   .btn-rw
    {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 20px;
    }
   .btn,.checkout-btn
    {
        font-size: 15px;
        padding: 12px 24px;
        border: none;
        text-decoration: none;
        cursor: pointer;
        font-weight: 600;
    }
   .btn
    {
      background: var(--cream);
      color: var(--charcoal);
    }
   .checkout-btn
    {
      background: var(--charcoal);
      color: white;
    }
   .empty-txt
    {
      text-align: center;
      font-size: 20px;
      color: var(--charcoal);
      margin-top: 50px;
    }
   .cart-itm
    {
      width: 100%;
      max-width: 800px;
      margin: 20px auto 0;
      background-color: var(--butter);
      display: flex;
      flex-direction: row;
      gap: 20px;
      padding: 20px;
      border-radius: 15px;
      align-items: center;
    }
   .cart-main
    {
      width: 100%;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    @media(max-width:600px)
    {
     .navbar
      {
        padding: 0 15px;
      }
     .nav-cntr
      {
        gap: 12px;
        font-size: 14px;
      }
     .cart-itm
      {
        flex-direction: column;
        text-align: center;
      }
     .card-box
      {
        width: 100%;
        max-width: 200px;
        height: 200px;
      }
     .remove-btn
      {
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <div class="navbar">
    <div class="nav-lft">
      <div class="logo">Rosalyn</div>
    </div>
    <div class="nav-cntr">
        <a href="index.html">Home</a>
        <a href="index.html#container-four">About</a>
        <a href="ProductSectionOne.html">Collections</a>
      </div>
    <div class="nav-rgt">
       <a href="wishlist.html">
       <i class="ri-heart-3-line"></i>
        <span id="wishlist-count">0</span>
        </a>
    </div>
  </div>

  <div class="cart-main">
    <div id="cart-container"></div>
    <div class="cart-total" id="total"></div>
    <div class="btn-rw" id="btns"></div>
  </div>

  <script>
    let cart = JSON.parse(localStorage.getItem('Rosalyn_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('Rosalyn_wishlist')) || [];
    const container = document.getElementById('cart-container');

    function saveToStorage()
    {
      localStorage.setItem('Rosalyn_cart', JSON.stringify(cart));
    }

    function updateCounts()
    {
      const wishCountEl = document.getElementById('wishlist-count');
      if(wishCountEl) wishCountEl.innerText = wishlist.length;
    }

    function renderCart()
    {
      container.innerHTML = '';
      let total = 0;

      if (cart.length === 0)
      {
        container.innerHTML = '<div class="empty-txt">Your cart is empty</div>';
        document.getElementById('total').innerHTML = '';
        document.getElementById('btns').innerHTML = '<a href="index.html" class="btn">Continue Shopping</a>';
        updateCounts();
        return;
      }

      cart.forEach((item, index) =>
      {
        if(!item.qty) item.qty = 1;
        total += item.price * item.qty;

        container.innerHTML += `
          <div class="cart-itm">
            <div class="card-box"><img src="${item.img}"></div>
            <div class="product-description">
              <div class="cart-nm">${item.name}</div>
              <div class="cart-prc">Rs.${item.price.toLocaleString('en-IN')}</div>
              <div class="qty-rw">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <div>${item.qty}</div>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
              </div>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">
              <i class="ri-delete-bin-line"></i>
            </button>
          </div>
        `;
      });

      document.getElementById('total').innerHTML = `Total: Rs.${total.toLocaleString('en-IN')}`;
      document.getElementById('btns').innerHTML = `
        <a href="index.html" class="btn">Continue Shopping</a>
        <a href="checkout.html" class="checkout-btn">Checkout</a>
      `;
      updateCounts();
    }

    function updateQty(index, change)
    {
      cart[index].qty += change;
      if (cart[index].qty <= 0) cart.splice(index, 1);
      saveToStorage();
      renderCart();
    }

    function removeItem(index)
    {
      cart.splice(index, 1);
      saveToStorage();
      renderCart();
    }

    renderCart();
  </script>
</body>
</html>
